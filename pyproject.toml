[project]
name = "llm-inference"
version = "0.1.0"
description = "High-throughput continuous batching LLM/SLM inference engine with two-tier authentication and OpenAI-compatible API"
readme = "README.md"
authors = [
    { name = "Avilash Kumar", email = "avilashkumar4@gmail.com" }
]
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.15.0",
    "asyncpg>=0.32.0",
    "fastapi>=0.143.3",
    "greenlet>=3.5.6",
    "httpx>=0.28.1",
    "locust>=2.46.7",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.0",
    "redis>=8.1.0",
    "safetensors>=0.8.0",
    "sqlalchemy>=2.1.5",
    "sse-starlette>=3.5.0",
    "torch>=2.14.1",
    "transformers>=5.20.1",
    "uvicorn[standard]>=0.54.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["data", ".venv", ".git"]


